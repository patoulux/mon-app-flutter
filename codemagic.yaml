workflows:
  ios-no-sign:
    name: iOS Build Non Signe
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Installer les dépendances
        script: |
          flutter packages pub get
      - name: Build de l'application pour iOS
        script: |
          flutter build ios --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
